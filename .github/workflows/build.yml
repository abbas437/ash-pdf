name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a GitHub Release with this tag, e.g. v0.1.0 (leave empty to only build)'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release (test build)'
        type: boolean
        required: false
        default: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed only by the tag-build release step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses
      - name: npm test
        shell: bash
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          cat test-out.txt
          if [ $code -ne 0 ]; then
            # The failing tests and the lines after each (the error), not just the tail of the run.
            msg=$( (grep -n -A 30 '^not ok\|^    not ok' test-out.txt | head -c 3000; tail -c 400 test-out.txt) | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=npm test failed::$msg"
          fi
          exit $code
      - run: npm run vendor
      - name: Build installer and portable exe
        shell: bash
        run: |
          set +e
          npm run dist > dist-out.txt 2>&1
          code=$?
          cat dist-out.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3500 dist-out.txt | tr -d '\r' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=electron-builder failed::$msg"
          fi
          exit $code
      - name: SHA256SUMS.txt
        shell: pwsh
        working-directory: dist
        run: |
          $files = Get-ChildItem -File -Filter 'ASH-PDF-Studio-*.exe' | Sort-Object Name
          if ($files.Count -ne 2) { throw "expected 2 .exe files, found $($files.Count)" }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASH-PDF-Studio-windows-x64
          path: |
            dist/ASH-PDF-Studio-Setup-*.exe
            dist/ASH-PDF-Studio-Portable-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ASH-PDF-Studio-Setup-*.exe \
            dist/ASH-PDF-Studio-Portable-*.exe \
            dist/SHA256SUMS.txt \
            --title "ASH PDF Studio $GITHUB_REF_NAME" \
            --generate-notes
      - name: GitHub Release (manual run with a version)
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRE=""; if [ "$PRERELEASE" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$VERSION" --target "$GITHUB_SHA" $PRE \
            dist/ASH-PDF-Studio-Setup-*.exe \
            dist/ASH-PDF-Studio-Portable-*.exe \
            dist/SHA256SUMS.txt \
            --title "ASH PDF Studio $VERSION" \
            --generate-notes

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run vendor && npm test
